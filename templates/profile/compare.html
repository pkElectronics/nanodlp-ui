{% extends "../base.html" %}
{% block content %}
<script>
    $(document).ready(function () {
        $(".profile-selector").change(function () {
            compare_profiles();
        });
        var profiles = "{{profileIDs}}".split(",");
        $(".profile-selector:eq(0) option[value='" + profiles[0] + "']").prop("selected", true);
        $(".profile-selector:eq(1) option[value='" + profiles[1] + "']").prop("selected", true);
        compare_profiles();
    });
    function convertToString(obj) {
        if (Array.isArray(obj)) {
            return obj.map(convertToString).join(', ');
        } else if (typeof obj === 'object' && obj !== null) {
            const entries = Object.entries(obj);
            return entries.map(([key, value]) => `${key}: ${convertToString(value)}`).join(', ');
        }
        return obj;
    }
    function compare_profiles() {
        $.getJSON("/profile/json/" + $(".profile-selector:eq(0)").val(), function (profile1) {
            $.getJSON("/profile/json/" + $(".profile-selector:eq(1)").val(), function (profile2) {
                $("#profile-compare thead th:eq(1)").html(profile1.Title);
                $("#profile-compare thead th:eq(2)").html(profile2.Title);
                $("#profile-compare tbody").html("");
                var differences = 0;
                var keys = Object.keys(profile1);
                keys.forEach(key => {
                    if (key == "Title" || key == "ProfileID") return;
                    var v1 = convertToString(profile1[key]);
                    var v2 = convertToString(profile2[key]);
                    if (key == "Updated") {
                        v1 = new Date(v1 * 1000).toLocaleString();
                        v2 = new Date(v2 * 1000).toLocaleString();
                    }
                    if (v1 !== v2) {
                        $("#profile-compare tbody").append("<tr><td>" + key + "</td><td>" + v1 + "</td><td>" + v2 + "</td></tr>");
                        differences++;
                    }
                });
                $("#profile-compare").toggleClass("hidden", differences === 0);
                $("#profile-compare-empty").toggleClass("hidden", differences !== 0);
            });
        });
    }
</script>
<div class="c3d-workflow-page c3d-compare-page">
<div class="c3d-page-head">
    <div>
        <div class="c3d-page-eyebrow"><translate>Resins</translate></div>
        <h1 class="c3d-page-title"><translate>Compare Profiles</translate></h1>
        <p class="c3d-page-description"><translate>Select two resin profiles to compare their differing settings.</translate></p>
    </div>
</div>
<section class="c3d-card">
    <div class="c3d-compare-selectors">
        <div>{{ selectProfile(profiles,0) }}</div>
        <div>{{ selectProfile(profiles,0) }}</div>
    </div>
</section>
<section class="c3d-card c3d-compare-results" aria-label="Profile differences">
<div class="c3d-table-scroll">
<table class="table" id="profile-compare">
    <thead>
        <tr>
            <th translate>Parameter</th>
            <th></th>
            <th></th>
        </tr>
    </thead>
    <tbody>

    </tbody>
</table>
<div id="profile-compare-empty" class="c3d-empty-state hidden"><translate>No differences found between these profiles.</translate></div>
</div>
</section>
</div>
{% endblock %}
